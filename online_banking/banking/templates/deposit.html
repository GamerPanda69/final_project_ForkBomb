{% extends 'base.html' %}
{% block content %}
<div class="container slide-in">
    <h2>Deposit Money</h2>
    <p>Current Balance: ₹{{ account.balance }}</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Deposit</button>
    </form>
    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Back</a>
</div>
{% endblock %}
