{% extends 'base.html' %}
{% block content %}
<div class="container slide-in">
    <h2>Loan Amount Estimation</h2>
    {% if prediction %}<p class="text-success">Estimated Loan Amount: ₹{{ prediction }}</p>{% endif %}
    {% if error %}<p class="text-danger">{{ error }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Age:</label><input type="number" name="age" required><br>
        <label>Monthly Income (₹):</label><input type="number" name="monthly_income" step="0.01" required><br>
        <label>Credit Score (300-850):</label><input type="number" name="credit_score" min="300" max="850" required><br>
        <label>Loan Tenure (Years):</label><input type="number" name="tenure" required><br>
        <label>Existing Loan Amount (₹):</label><input type="number" name="existing_loan" step="0.01" required><br>
        <label>Number of Dependents:</label><input type="number" name="dependents" required><br>
        <button type="submit" class="btn btn-primary">Estimate</button>
    </form>
    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Back</a>
</div>
{% endblock %}
